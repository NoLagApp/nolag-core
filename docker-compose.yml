# NoLag, running on your machine in a few minutes.
#
# This is a demonstration stack, NOT a production deployment. No TLS, secrets
# in a plaintext .env, Postgres in a container with no backups, one node, no
# message history. README.md lists the omissions in full. Take the images and
# the shape of the wiring; leave the rest.
#
#   postgres  configuration and authorization state
#   core      the example host: a thin, unauthenticated surface over
#             @nolag/core, which decides whether an actor may reach a topic
#   kraken    the broker: holds the sockets, enforces the answer
#   ui        a browser admin surface over the example host
#
# There is no external message broker. Kraken's default fan-out is in-process
# (syn), so a single node needs nothing else. Swap in MQTT later if you want
# a broker you already operate.
#
# Every published port is bound to 127.0.0.1. The example host asks nobody for
# anything, so reaching it is the same as owning every project in it.
#
# Start with ./quickstart/quickstart.sh, which writes .env and seeds a demo
# project. `docker compose up` on its own works too, once .env exists.

name: nolag

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nolag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nolag}
      POSTGRES_DB: nolag_core
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed for inspection only. Nothing in this stack reaches Postgres
      # over the published port.
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nolag -d nolag_core"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  core:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: nolag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nolag}
      POSTGRES_DATABASE: nolag_core
      # Core applies its own migrations on boot. Nothing else owns this schema.
      SKIP_MIGRATIONS: "false"
      # Needed only to issue browser client tokens. Generated by quickstart.sh.
      SIGNING_KEY_ENCRYPTION_KEY: ${SIGNING_KEY_ENCRYPTION_KEY:-}
      # The admin UI is a browser client on another origin, so it needs to be
      # named here. A deployment without the UI should leave this empty.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${UI_PORT:-3401}}
    ports:
      # Loopback only. This host authenticates nobody, so anything that can
      # reach the port can mint credentials for every project.
      - "127.0.0.1:${CORE_PORT:-3400}:3000"

  kraken:
    build:
      # Built from source: there is no published image yet. Point
      # KRAKEN_CONTEXT at a local checkout to build from working changes.
      #
      # Pinned to a branch, not main, until that branch merges. It carries the
      # fix that makes kraken honour the path in auth_http_url; without it every
      # authorization call lands on core's root and 404s, which surfaces as an
      # authentication failure rather than as a configuration error. Drop the
      # #ref once it is on main.
      context: ${KRAKEN_CONTEXT:-https://github.com/NoLagApp/kraken.git#fix/gun-client-base-path}
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    environment:
      # Delegate every authorization decision to core.
      AUTH_BACKEND: http
      AUTH_HTTP_URL: http://core:3000/v1/internal/actors
      # No BACKEND_SECRET: the example host authenticates nobody, so there is
      # no shared secret to configure. A real deployment mounts these facades
      # behind its own authentication and sets this to whatever that expects.
      #
      # In-process fan-out. No external broker.
      BROKER_BACKEND: syn
      # In-memory history with a TTL. Message recording is off: turning it on
      # without a durable store backend gives history that dies with the
      # container, which is worse than none.
      STORE_BACKEND: ets
      RECORD_MESSAGES: "false"
      # Usage reporting and webhook retries are a hosted concern.
      CONTROL_BACKEND: noop
      INTERNAL_SECRET: ${KRAKEN_INTERNAL_SECRET:-change_me}
    ports:
      - "127.0.0.1:${KRAKEN_PORT:-8410}:8080"
      - "127.0.0.1:${KRAKEN_MQTT_PORT:-18843}:1883"

  ui:
    build:
      context: ./ui
      args:
        # Baked in at build time: this is a static bundle with no server to
        # read configuration at runtime. It is a URL, not a secret.
        VITE_CORE_URL: ${PUBLIC_CORE_URL:-http://localhost:${CORE_PORT:-3400}}
        VITE_KRAKEN_URL: ${PUBLIC_KRAKEN_URL:-ws://localhost:${KRAKEN_PORT:-8410}/ws}
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "127.0.0.1:${UI_PORT:-3401}:8080"

volumes:
  pgdata:
