server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so they can be cached indefinitely. index.html is not
    # hashed and must not be, or a redeploy would keep serving the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # This page holds a system key in memory. It loads nothing from anywhere
    # else, so the policy can say exactly that: scripts and styles from here,
    # connections to core and to the broker, and nothing embedded or framed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src *; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Nothing here should ever be indexed: it is an admin surface.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
